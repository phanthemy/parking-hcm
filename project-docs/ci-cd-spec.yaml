# MAPGO PRODUCTION CI/CD QUALITY GATE SPECIFICATION
# Pipeline stages: Lint -> Typecheck -> Domain Tests -> SEO Tests -> Turbopack Build -> Load Smoke Test

name: MapGo Production CI/CD Quality Gate

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: 1. TypeScript Strict Type Checking
        run: npx tsc --noEmit

      - name: 2. Domain Layer Unit Tests
        run: node scripts/test-domain-layer.js

      - name: 3. SEO Engine & Schema Graph Tests
        run: node scripts/test-seo-engine.js

      - name: 4. Next.js Turbopack Build
        run: npm run build
